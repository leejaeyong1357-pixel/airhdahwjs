<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>현장밀착점검 보고서</title>
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-art" id="heroArt">
      <!-- 공장 배관 · 안전모 · 점검표 그림 (관리자 페이지에서 사진으로 바꿀 수 있음) -->
      <svg viewBox="0 0 620 170" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b3f7a" /><stop offset="1" stop-color="#5d7fae" /></linearGradient>
          <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#c7d3e6" /></linearGradient>
          <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16346c" /><stop offset=".35" stop-color="#16346c" stop-opacity="0" /></linearGradient>
        </defs>
        <rect width="620" height="170" fill="url(#sky)" />
        <!-- 배관 · 철골 -->
        <g stroke="#8ea6c8" stroke-width="7" opacity=".55" fill="none">
          <path d="M40 0v170M78 0v170M150 0v170M210 20v150M300 0v170" />
          <path d="M0 52h330M0 96h330M120 140h220" />
        </g>
        <g stroke="#d6a52a" stroke-width="4" opacity=".85" fill="none"><path d="M150 112h160l30-24h80M150 128h170" /><path d="M170 112v58M230 112v58M290 112v58" stroke-width="3" /></g>
        <g fill="#a9bcd8" opacity=".5"><rect x="250" y="10" width="40" height="80" rx="8" /><rect x="96" y="20" width="34" height="110" rx="8" /></g>
        <!-- 안전모 -->
        <g transform="translate(330 40)">
          <path d="M10 92c0-50 34-82 78-82s78 32 78 82z" fill="url(#hat)" />
          <path d="M-6 92h200c6 0 8 14 0 16H-6c-8-2-6-16 0-16z" fill="#e8eef8" />
          <path d="M78 12c-4 22-4 50 0 80M98 12c4 22 4 50 0 80" stroke="#b6c4da" stroke-width="5" fill="none" />
          <text id="artHelmet" x="88" y="74" text-anchor="middle" font-size="18" font-weight="800" fill="#1d3f86" transform="rotate(-8 88 74)">PT생산실</text>
        </g>
        <!-- 점검표 -->
        <g transform="translate(486 6) rotate(8)">
          <rect x="0" y="12" width="128" height="164" rx="8" fill="#2c4d8a" />
          <rect x="8" y="22" width="112" height="148" rx="4" fill="#fbfcff" />
          <rect x="40" y="4" width="48" height="18" rx="5" fill="#9aa8bd" />
          <text id="artClip" x="64" y="44" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1b2b4a">일일현장안전점검</text>
          <g stroke="#2457d6" stroke-width="3.5" fill="none"><path d="M18 62l6 6 12-12M18 92l6 6 12-12M18 122l6 6 12-12" /></g>
          <g stroke="#b9c4d6" stroke-width="5"><path d="M44 66h62M44 96h62M44 126h62" /></g>
        </g>
        <rect width="620" height="170" fill="url(#fadeL)" />
      </svg>
    </div>
    <div class="hero-in">
      <div class="brand">
        <svg viewBox="0 0 48 40" class="factory" aria-hidden="true"><path d="M2 38V20l10-7v7l10-7v7l10-7V4h5v16h5V4h5v34z" fill="#fff" /><g fill="#16346c"><rect x="8" y="28" width="5" height="4" /><rect x="16" y="28" width="5" height="4" /><rect x="24" y="28" width="5" height="4" /><rect x="32" y="28" width="5" height="4" /></g></svg>
        <span id="brand"></span>
      </div>
      <div class="titles"><h1 id="title"></h1><p id="subtitle"></p></div>
    </div>
  </header>

  <main class="wrap">
    <section class="notice">
      <svg viewBox="0 0 64 56" class="mega" aria-hidden="true"><path d="M6 20h10l26-14v44L16 36H6z" fill="#1d4fc0" /><path d="M14 36l6 16h8l-5-16z" fill="#163a8f" /><path d="M48 18c4 3 4 17 0 20M54 12c8 6 8 26 0 32" stroke="#1d4fc0" stroke-width="3.5" fill="none" stroke-linecap="round" /></svg>
      <div><p class="greet"><span id="greetPre"></span><b id="greetName"></b><span id="greetPost"></span></p><p class="ntext" id="notice"></p></div>
    </section>

    <section class="box">
      <div class="box-h">
        <svg viewBox="0 0 56 44" class="folder" aria-hidden="true"><path d="M2 8a4 4 0 014-4h14l5 6h25a4 4 0 014 4v26a4 4 0 01-4 4H6a4 4 0 01-4-4z" fill="#163a8f" /><path d="M2 16h52v24a4 4 0 01-4 4H6a4 4 0 01-4-4z" fill="#1d4fc0" /></svg>
        <h2 id="sectionTitle"></h2>
        <p class="hint"><svg viewBox="0 0 24 24" class="ico"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg><span id="sectionHint"></span></p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="info">
      <div class="info-h"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="9.5" /><path d="M12 11v6M12 7.5v.5" /></svg><span id="infoTitle"></span></div>
      <ul id="info"></ul>
    </section>
  </main>
  <a class="gear" href="admin" title="환경설정 (관리자)" aria-label="환경설정"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" /></svg></a>
  <script type="module" src="app.js"></script>
</body>
</html>
